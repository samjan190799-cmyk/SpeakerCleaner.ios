name: SpeakerCleaner
options:
  bundleIdPrefix: com.samvel.speakercleaner
targets:
  SpeakerCleaner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: PhoneCare
        CFBundleDisplayName: "PhoneCare"
        CFBundleIdentifier: com.samvel.speakercleaner
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: SpeakerCleaner
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Требуется доступ к микрофону для проведения спектральной оценки чистоты динамика и вычисления частотного отклика."
        UIBackgroundModes:
          - audio
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: "complete"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        PRODUCT_NAME: SpeakerCleaner
        DEVELOPMENT_TEAM: V7J345DY58
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
