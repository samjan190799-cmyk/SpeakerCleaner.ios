name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Сборка и отправка в TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE="/Applications/Xcode.app"
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ─── 1. Разворачиваем App Store Connect API Ключ ────────────────
      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          KEY_ID=$(echo "$KEY_ID" | tr -d '\r\n ')
          ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '\r\n ')

          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_B64" ]; then
            echo "::error::Не найдены секреты App Store Connect API!"
            exit 1
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          echo "$API_KEY_B64" | tr -d '\r\n ' | base64 --decode | tr -d '\r' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "APPSTORE_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=$ISSUER_ID" >> $GITHUB_ENV
          echo "AUTH_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
          echo "✅ API Ключ развёрнут по пути: $KEY_PATH"

      # ─── 2. Временный Keychain для подписи ────────────────────────
      - name: Setup Keychain for Xcode
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KP="123456"

          security create-keychain -p "$KP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KP" >> $GITHUB_ENV
          echo "✅ Временный Keychain настроен"

      # ─── 3. Генерация проекта XcodeGen ────────────────────────────
      - name: Generate Xcode Project
        run: |
          xcodegen generate

      # ─── 4. Архивация Release билда ────────────────────────────────
      - name: Archive Project
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SpeakerCleaner.xcodeproj \
            -scheme SpeakerCleaner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/PhoneCare.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="V7J345DY58" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

          if [ ! -d "$RUNNER_TEMP/PhoneCare.xcarchive" ]; then
            echo "::error::Архивация не удалась. Лог архивации:"
            tail -50 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          echo "✅ Архив приложения успешно создан!"

      # ─── 5. Автоматическая подготовка сертификатов и профилей ──────
      - name: Auto Setup Certificates & Profiles
        run: |
          python3 .github/scripts/auto_cert_setup.py

      # ─── 6. Создание ExportOptions.plist ────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>V7J345DY58</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.samvel.speakercleaner</key>
              <string>${MAIN_APP_PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF
          echo "✅ ExportOptions.plist сформирован с UUID: $MAIN_APP_PROFILE_UUID"

      # ─── 7. Экспорт и подпись готового IPA ──────────────────────────
      - name: Export & Sign IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PhoneCare.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates \
            2>&1 | tee "$RUNNER_TEMP/export.log"

          IPA=$(find "$RUNNER_TEMP/Export" -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::IPA файл не найден. Лог экспорта:"
            tail -50 "$RUNNER_TEMP/export.log"
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          echo "✅ IPA успешно создан и подписан: $IPA"

      # ─── 8. Загрузка в TestFlight ──────────────────────────────────
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          echo "🚀 Отправка сборки в TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

          echo "🎉 Приложение успешно отправлено в TestFlight!"

      # ─── 9. Сохранение артефакта сборки ─────────────────────────────
      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCare-IPA-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 30
